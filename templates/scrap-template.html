<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{기사 제목}} · naelog</title>
  <meta name="description" content="{{이 기사가 무슨 이야기인지 한 줄}}" />
  <!-- 홈 목록에 쓰이는 정보 -->
  <meta name="post:log" content="scrap" />
  <meta name="post:date" content="{{YYYY-MM-DD}}" />
  <meta name="post:category" content="{{매체}}" />
  <meta name="post:tags" content="{{태그1, 태그2}}" />
  <!-- <meta name="post:draft" content="true" />  홈에서 숨기려면 주석 해제 -->
  <link rel="stylesheet" href="../../assets/naedevlog.css" />
  <script src="../../assets/site.js"></script>
</head>
<body>
  <header class="site-header"><div class="inner">
    <a class="logo" href="../../">naelog</a>
    <nav class="nav">
      <a href="../../dev/">dev</a>
      <a href="../../book/">book</a>
      <a href="../../scrap/" aria-current="page">scrap</a>
    </nav>
  </div></header>

  <main class="wrap">
    <div class="category">{{매체}}</div>
    <h1>{{기사 제목}}</h1>
    <p class="lead">{{이 기사가 무슨 이야기인지 한 줄}}</p>
    <div class="post-meta">
      <span>{{YYYY.MM.DD}}</span>
      <span class="tag">{{태그}}</span>
    </div>

    <a class="source" href="{{원문 URL}}" target="_blank" rel="noopener">
      <span class="source-title">{{기사 제목}}</span>
      <span class="source-by">{{저자}} · {{매체}}, {{발행 시기}}</span>
      <span class="source-url">{{도메인/경로}}</span>
    </a>

    <h2>발췌</h2>
    <div class="quotes">
      <blockquote class="quote"><p>{{발췌 문장, 원문 그대로}}</p></blockquote>
    </div>

    <!-- 메모: 한두 문장이면 충분하다. 없으면 지운다 -->
    <h2>메모</h2>
    <p>{{왜 공유하는지, 읽고 든 생각}}</p>
  </main>
  <footer class="site-footer">naelog · scrap</footer>
  <script src="../../assets/edit.js"></script>
</body>
</html>
